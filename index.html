<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<title id="page-title"></title>
<link rel="stylesheet" href="style.css" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="icon" type="image/png" href="./redumbrella_black.png" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<style>
.logo-waiting {
  display: block;
  margin: 20px auto;
  height: 80px;
}
.project-entry {
  text-align: center;
  margin-top: 20px;
}
.project-entry label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}
.project-entry input {
  padding: 6px;
  margin-right: 8px;
}
.project-entry button {
  padding: 6px 12px;
}
footer {
  margin-top: 20px;
  text-align: left;
  color: #666;
  position: fixed;
  bottom: 0;
  left: 0;
  padding: 8px;
}
</style>

</head>

<body>

<header>
  <div id="logo-container" style="text-align:center; margin:20px 0;"></div>

  <h1 id="portal-title"
      style="display:flex; align-items:center; gap:8px; margin-left:20px;">
    <img src="./RedUmbrellaPro_black.png"
         alt="Portal Logo"
         style="height:26px; width:auto;" />
    <span id="portal-title-text"></span>
  </h1>

  <div id="project-selector-row" style="display:none;"></div>
</header>

<nav id="tabs" style="display:none;"></nav>
<div id="tab-content"></div>

<footer>
  <small style="display:block; opacity:0.7;">Portal Version: 2.0.0</small>
</footer>

<script type="module">

/* ============================================================
   IMPORT TAB MODULES
============================================================ */
import { loadContactsTab } from "./js/contacts.js";
import { loadFinancialsTab } from "./js/financials.js";
import { loadNotesTab } from "./js/notes.js";
import { loadTasksTab } from "./js/tasks.js";
import { loadLookupsTab } from "./js/lookups.js";
import { loadGroupsTab } from "./js/groups.js";
import { loadSetupTab } from "./js/setup.js";
import { loadOperationsTab } from "./js/operations.js";
import { loadEmailsTab } from "./js/emails.js";
import { loadECCampaignsTab } from "./js/ecampaigns.js";
import { loadPipelineTab } from "./js/pipeline.js";
import { loadFilterTab } from "./js/filter.js";

/* ============================================================
   PORTAL STATE
============================================================ */
const portalState = {
  project: "",
  contactId: "",
  userEmail: "" // blank = not logged in
};
window.portalState = portalState;

const portalTitleText = document.getElementById("portal-title-text");
const pageTitle = document.getElementById("page-title");
const selectorRow = document.getElementById("project-selector-row");
const tabs = document.getElementById("tabs");
const tabContent = document.getElementById("tab-content");
const logoContainer = document.getElementById("logo-container");

const tabMap = {
  "1": { label: "Contacts", loader: loadContactsTab },
  "2": { label: "Financials", loader: loadFinancialsTab },
  "3": { label: "Notes", loader: loadNotesTab },
  "4": { label: "Tasks", loader: loadTasksTab },
  "5": { label: "Lookups", loader: loadLookupsTab },
  "6": { label: "E-Campaigns", loader: loadECCampaignsTab },
  "7": { label: "Groups", loader: loadGroupsTab },
  "8": { label: "Setup", loader: loadSetupTab },
  "9": { label: "Operations", loader: loadOperationsTab },
  "10": { label: "Emails", loader: loadEmailsTab },
  "11": { label: "Pipeline", loader: loadPipelineTab },
  "12": { label: "Filter", loader: loadFilterTab }
};

/* ============================================================
   AUTO-PROMPT LOGIN
============================================================ */
async function autoPromptLogin() {
  const email = prompt("Enter your email to access the portal:");
  if (!email) return;
  await handlePortalLogin(email);
}

/* ============================================================
   REAL LOGIN LOGIC — WITH RETRY ON INVALID
============================================================ */
async function handlePortalLogin(enteredEmail) {
  try {
    const res = await fetch(
      "https://client-portal-api.dennis-e64.workers.dev/api/check_staff",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project: portalState.project,
          email: enteredEmail
        })
      }
    );

    const result = await res.json();

    if (!result.valid) {
      await fetch(
        "https://client-portal-api.dennis-e64.workers.dev/api/log_portal_login",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            project: portalState.project,
            email: enteredEmail,
            status: "failed",
            reason: "not_staff",
            userAgent: navigator.userAgent
          })
        }
      );

      alert("This email is not authorized for this project.");

      /* ⭐ RETRY LOGIN IMMEDIATELY */
      await autoPromptLogin();
      return;
    }

    portalState.userEmail = enteredEmail;

    await fetch(
      "https://client-portal-api.dennis-e64.workers.dev/api/log_portal_login",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project: portalState.project,
          email: enteredEmail,
          status: "success",
          reason: "authorized",
          userAgent: navigator.userAgent
        })
      }
    );

    console.log("Logged in as:", portalState.userEmail);

    tabs.style.display = "block";

  } catch (err) {
    console.error("Login error:", err);

    await fetch(
      "https://client-portal-api.dennis-e64.workers.dev/api/log_portal_login",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          project: portalState.project,
          email: enteredEmail,
          status: "failed",
          reason: "server_error",
          userAgent: navigator.userAgent
        })
      }
    );

    alert("Unable to log in. Please try again.");

    /* ⭐ RETRY ON SERVER ERROR TOO */
    await autoPromptLogin();
  }
}

window.handlePortalLogin = handlePortalLogin;

/* ============================================================
   TEST LOGIN BUTTON — STILL WORKS
============================================================ */
document.getElementById("testLoginBtn").addEventListener("click", async () => {
  const email = prompt("Enter test email:");
  if (!email) return;

  await handlePortalLogin(email);
});

/* ============================================================
   LOAD PROJECTS — AUTO-PROMPT ONLY AFTER PROJECT IS KNOWN
============================================================ */
async function loadProjects() {
  try {
    const res = await fetch(
      "https://client-portal-api.dennis-e64.workers.dev/api/projects_config",
      { cache: "no-cache" }
    );

    const projects = await res.json();
    if (!Array.isArray(projects) || projects.length === 0)
      throw new Error("No projects returned");

    const urlParams = new URLSearchParams(window.location.search);
    const projectParamRaw = urlParams.get("project");
    let projectParam = projectParamRaw ? projectParamRaw.trim() : "";

    /* CASE 1 — No ?project param */
    if (!projectParam) {
      logoContainer.innerHTML =
        `<img src="./RedUmbrellaPro Header2.png"
              alt="Red Umbrella Pro"
              class="logo-waiting" />`;

      selectorRow.style.display = "block";
      selectorRow.className = "project-entry";

      selectorRow.innerHTML = `
        <label for="projectInput">Enter Project Name:</label>
        <input id="projectInput" type="text" placeholder="Project name" />
        <button id="btnSetProject" class="primary">Enter</button>
      `;

      portalState.project = "";
      portalTitleText.textContent = "";
      pageTitle.textContent = "";
      tabs.style.display = "none";

      document.getElementById("btnSetProject").addEventListener("click", async () => {
        const projectName =
          document.getElementById("projectInput").value.trim();

        if (!projectName) {
          alert("Please enter a project name.");
          return;
        }

        const match = projects.find(
          p => String(p.project).toLowerCase() === projectName.toLowerCase()
        );

        if (!match) {
          tabContent.innerHTML =
            `<section class="card"><p>Invalid project specified. No UI available.</p></section>`;
          return;
        }

        logoContainer.innerHTML = "";
        selectorRow.style.display = "none";

        injectConfig(match);
        const enabledTabs = normalizeTabs(match.enabled_tabs);
        renderTabs(enabledTabs);

        /* ⭐ AUTO-PROMPT NOW THAT PROJECT IS KNOWN */
        if (!portalState.userEmail) {
          await autoPromptLogin();
        }

        if (portalState.userEmail) {
          tabs.style.display = "block";
          tabContent.innerHTML = "";
        } else {
          tabs.style.display = "none";
        }
      });

      return;
    }

    /* CASE 2 — ?project param exists */
    const match = projects.find(
      p => String(p.project).toLowerCase() === projectParam.toLowerCase()
    );

    if (!match) {
      tabs.style.display = "none";
      tabContent.innerHTML =
        `<section class="card"><p>Invalid project specified. No UI available.</p></section>`;
      return;
    }

    logoContainer.innerHTML = "";
    selectorRow.style.display = "none";

    injectConfig(match);
    const enabledTabs = normalizeTabs(match.enabled_tabs);
    renderTabs(enabledTabs);

    /* ⭐ AUTO-PROMPT NOW THAT PROJECT IS KNOWN */
    if (!portalState.userEmail) {
      await autoPromptLogin();
    }

    if (portalState.userEmail) {
      tabs.style.display = "block";
    } else {
      tabs.style.display = "none";
    }

  } catch (err) {
    console.error("Failed to load projects:", err);
    selectorRow.style.display = "none";
    tabs.style.display = "none";
    tabContent.innerHTML =
      `<section class="card"><p>Unable to load projects. Please try again later.</p></section>`;
  }
}

/* ============================================================
   SUPPORT FUNCTIONS
============================================================ */
function injectConfig(config) {
  portalState.project = config.project;
  portalState.projects_config = config;
  portalState.display_name = config.display_name;
  portalState.business_name = config.business_name;
  portalState.contact_name = config.contact_name;
  portalState.contact_email = config.contact_email;
  portalState.contact_first_name = config.contact_first_name;
  portalState.contact_last_name = config.contact_last_name;
  portalState.enabled_tabs = config.enabled_tabs || [];

  portalTitleText.textContent = config.display_name || "";
  pageTitle.textContent = config.display_name || "";
}

function normalizeTabs(raw) {
  if (Array.isArray(raw)) return raw;
  if (typeof raw === "string") {
    try { return JSON.parse(raw); }
    catch { return []; }
  }
  return [];
}

function renderTabs(enabledTabs) {
  tabs.innerHTML = enabledTabs
    .map(tabId =>
      tabMap[tabId]
        ? `<button data-tab="${tabId}">${tabMap[tabId].label}</button>`
        : ""
    )
    .join("");

  tabs.querySelectorAll("button[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => loadTab(btn.dataset.tab));
  });
}

async function loadTab(tabId) {
  document.querySelectorAll("#tabs button")
    .forEach(btn => btn.classList.remove("active"));

  document.querySelector(`#tabs button[data-tab="${tabId}"]`)
    ?.classList.add("active");

  const tab = tabMap[tabId];
  if (tab && typeof tab.loader === "function") {
    tabContent.innerHTML = "";
    await tab.loader({ portalState, tabContent });
  }
}

/* ============================================================
   INITIALIZE
============================================================ */
window.addEventListener("DOMContentLoaded", async () => {
  await loadProjects();
});

</script>

<!-- ⭐ TEST LOGIN BUTTON (UNCHANGED) -->
<button id="testLoginBtn"
style="
position:fixed;
bottom:60px;
right:20px;
z-index:9999;
padding:8px 14px;
background:#333;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
opacity:0.7;
">
  Test Login
</button>

</body>
</html>
