<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />
<title id="page-title"></title>
<link rel="stylesheet" href="style.css" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="./redumbrella_black.png" />

<!-- Choices.js -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<style>

.logo-waiting {
display: block;
margin: 20px auto;
height: 80px;
}

.login-wrapper {
text-align: center;
margin-top: 20px;
}

.login-wrapper label {
display: block;
margin-bottom: 8px;
font-weight: bold;
}

.login-wrapper input {
padding: 6px;
margin-bottom: 10px;
width: 260px;
}

.login-wrapper button {
padding: 6px 12px;
margin-top: 10px;
}

#errorBox {
color: red;
margin-top: 10px;
height: 18px;
}

header {
margin-top: 20px;
}

footer {
margin-top: 20px;
text-align: left;
color: #666;
position: fixed;
bottom: 0;
left: 0;
padding: 8px;
}

/* ⭐ GOLD HELP TAB */
.nav-help {
color: #d4a017 !important;
font-weight: 600;
}

.nav-help.active {
border-bottom: 2px solid #d4a017 !important;
}

/* ⭐ Umbrella Challenge (NEW LAYOUT) */
#umbrellaChallenge {
display: none;
text-align: center;
margin-top: 30px;
}

#umbrellaInner {
max-width: 320px;
margin: 0 auto;
}

#umbrellaTarget {
width: 100px;
height: 100px;
display: block;
margin: 0 auto 10px auto;
pointer-events: none;
}

#umbrellaGrid {
display: flex;
justify-content: space-between;
gap: 10px;
margin-top: 10px;
}

#umbrellaGrid img {
width: 90px;
height: 90px;
cursor: pointer;
border: 3px solid transparent;
border-radius: 8px;
transition: border-color 0.15s ease;
}

#umbrellaGrid img:hover {
border-color: #d4a017;
}

</style>

</head>

<body>

<!-- LOGIN -->
<div id="loginForm" class="login-wrapper">

<img src="./RedUmbrellaPro Header2.png" alt="Red Umbrella Pro" class="logo-waiting" />

<div id="projectFieldBlock">
<label for="projectInput">Project:</label>
<input id="projectInput" type="text" placeholder="Project name" />
</div>

<label for="emailInput">Email:</label>
<input id="emailInput" type="email" placeholder="Email address" />

<button id="loginBtn">Login</button>

<div id="errorBox"></div>

</div>

<!-- ⭐ NEW — UMBRELLA CHALLENGE -->
<div id="umbrellaChallenge">
    <div id="umbrellaInner">
        <img id="umbrellaTarget" src="./images/image1.png" alt="Target umbrella" />
        <p id="umbrellaInstruction">Click the image that matches the one above.</p>
        <div id="umbrellaGrid"></div>
    </div>
</div>

<!-- PORTAL UI -->
<header id="portalHeader" style="display:none;">
<table style="border-collapse: collapse; margin-left: 20px;">
<tr>
<td rowspan="2" style="vertical-align: top; padding-right: 10px;">
<img src="./RedUmbrellaPro_black.png" alt="Portal Logo" style="height:32px; width:auto;" />
</td>
<td style="font-size: 26px; font-weight: 600;" id="welcomeHeader">Welcome</td>
</tr>
<tr>
<td style="font-size: 16px; opacity: 0.8;" id="subHeader">Portal</td>
</tr>
</table>
</header>

<nav id="tabs" style="display:none;"></nav>

<div id="tab-content"></div>

<footer id="portalFooter" style="display:none;">
<small style="display:block; opacity:0.7;">Portal Version: 2.0.0</small>
</footer>

<script type="module">

/* ============================================================
IMPORT TAB MODULES
============================================================ */

import { loadContactsTab } from "./js/contacts.js";
import { loadFinancialsTab } from "./js/financials.js";
import { loadNotesTab } from "./js/notes.js";
import { loadTasksTab } from "./js/tasks.js";
import { loadLookupsTab } from "./js/lookups.js";
import { loadGroupsTab } from "./js/groups.js";
import { loadSetupTab } from "./js/setup.js";
import { loadOperationsTab } from "./js/operations.js";
import { loadEmailsTab } from "./js/emails.js";
import { loadECCampaignsTab } from "./js/ecampaigns.js";
import { loadPipelineTab } from "./js/pipeline.js";
import { loadFilterTab } from "./js/filter.js";
import { loadRelationshipsTab } from "./js/relationships.js";
import { loadHelpTab } from "./js/help.js";

/* ============================================================
PORTAL STATE
============================================================ */

const portalState = {
project: "",
userEmail: "",
staffName: "",
allowedTabs: [],
deleteAllowed: false
};

window.portalState = portalState;

const loginForm = document.getElementById("loginForm");
const projectFieldBlock = document.getElementById("projectFieldBlock");
const projectInput = document.getElementById("projectInput");
const emailInput = document.getElementById("emailInput");
const loginBtn = document.getElementById("loginBtn");
const errorBox = document.getElementById("errorBox");

const portalHeader = document.getElementById("portalHeader");
const portalFooter = document.getElementById("portalFooter");
const welcomeHeader = document.getElementById("welcomeHeader");
const subHeader = document.getElementById("subHeader");
const pageTitle = document.getElementById("page-title");
const tabs = document.getElementById("tabs");
const tabContent = document.getElementById("tab-content");

const umbrellaChallenge = document.getElementById("umbrellaChallenge");
const umbrellaGrid = document.getElementById("umbrellaGrid");
const umbrellaInstruction = document.getElementById("umbrellaInstruction");
const umbrellaTarget = document.getElementById("umbrellaTarget");

/* ============================================================
SECURITY STATE
============================================================ */

const MAX_UMBRELLA_ATTEMPTS = 3;
let umbrellaAttempts = 0;
let pendingLoginContext = null;

/* ============================================================
TAB MAP
============================================================ */

const tabMap = {
"1": { label: "Contacts", loader: loadContactsTab },
"2": { label: "Financials", loader: loadFinancialsTab },
"3": { label: "Notes", loader: loadNotesTab },
"4": { label: "Tasks", loader: loadTasksTab },
"5": { label: "Lookups", loader: loadLookupsTab },
"6": { label: "E-Campaigns", loader: loadECCampaignsTab },
"7": { label: "Groups", loader: loadGroupsTab },
"8": { label: "Setup", loader: loadSetupTab },
"9": { label: "Operations", loader: loadOperationsTab },
"10": { label: "Emails", loader: loadEmailsTab },
"11": { label: "Pipeline", loader: loadPipelineTab },
"12": { label: "Filter", loader: loadFilterTab },
"13": { label: "Help", loader: loadHelpTab },
"15": { label: "Relationships", loader: loadRelationshipsTab }
};

/* ============================================================
IP LOCKOUT CHECK
============================================================ */

async function checkIpLockout() {

try {

const res = await fetch(
"https://client-portal-api.dennis-e64.workers.dev/api/check_portal_failed_login",
{ method: "POST", headers: { "Content-Type": "application/json" } }
);

const result = await res.json();

if (result.blocked) {

loginForm.style.display = "none";
umbrellaChallenge.style.display = "none";

const lockoutMsg = document.createElement("div");
lockoutMsg.style.textAlign = "center";
lockoutMsg.style.marginTop = "40px";
lockoutMsg.style.fontSize = "20px";
lockoutMsg.style.fontWeight = "600";
lockoutMsg.style.color = "red";
lockoutMsg.textContent = result.message ||
"You cannot use the system for the rest of the day.";

document.body.appendChild(lockoutMsg);
return;
}

loginForm.style.display = "block";

} catch (err) {

loginForm.style.display = "block";

}

}

/* ============================================================
LOGIN HANDLER (MODIFIED)
============================================================ */

async function attemptLogin() {

errorBox.textContent = "";

const project = projectInput.value.trim();
const email = emailInput.value.trim();

if (!project) {
errorBox.textContent = "Please enter a project.";
return;
}

if (!email) {
errorBox.textContent = "Please enter an email.";
return;
}

try {

const res = await fetch(
"https://client-portal-api.dennis-e64.workers.dev/api/check_staff",
{
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ project, email })
}
);

const result = await res.json();

await fetch(
"https://client-portal-api.dennis-e64.workers.dev/api/log_portal_login",
{
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
project,
email,
status: result.valid ? "success" : "invalid",
reason: result.valid ? null : "Email not found for project",
userAgent: navigator.userAgent
})
}
);

if (!result.valid) {
errorBox.textContent = "Invalid email for this project.";
return;
}

pendingLoginContext = { project, email, result };

emailInput.disabled = true;
loginBtn.disabled = true;
projectInput.disabled = true;

startUmbrellaChallenge();

} catch (err) {

errorBox.textContent = "Server error. Try again.";

}

}

loginBtn.addEventListener("click", attemptLogin);

loginForm.addEventListener("keydown", (e) => {
if (e.key === "Enter") {
e.preventDefault();
loginBtn.click();
}
});

/* ============================================================
UMBRELLA CHALLENGE LOGIC (NEW)
============================================================ */

function startUmbrellaChallenge() {
umbrellaAttempts = 0;
umbrellaChallenge.style.display = "block";
renderUmbrellaRound();
}

function renderUmbrellaRound() {

umbrellaTarget.src = "./images/image1.png";
umbrellaTarget.alt = "Target umbrella";

umbrellaGrid.innerHTML = "";

const umbrellaMap = {
target: "image1.png",
correct: "image4.png",
wrong: ["image2.png", "image3.png"]
};

const options = [
umbrellaMap.correct,
...umbrellaMap.wrong
];

for (let i = options.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[options[i], options[j]] = [options[j], options[i]];
}

let correctIndex = null;

options.forEach((file, index) => {

const img = document.createElement("img");
img.src = "./images/" + file;
img.alt = "Umbrella option";

const position = index + 1;

if (file === umbrellaMap.correct) {
correctIndex = position;
}

img.addEventListener("click", () => {
handleUmbrellaClick(position, correctIndex);
});

umbrellaGrid.appendChild(img);

});

const remaining = MAX_UMBRELLA_ATTEMPTS - umbrellaAttempts;

if (umbrellaAttempts === 0) {
umbrellaInstruction.textContent = "Click the image that matches the one above.";
} else if (remaining === 2) {
umbrellaInstruction.textContent = "Incorrect. Try again. You have 2 more attempts.";
} else if (remaining === 1) {
umbrellaInstruction.textContent = "Incorrect. You have one final attempt. If you do not get this correct, you will not be allowed in for rest of day";
}

}

async function handleUmbrellaClick(clickedPos, correctPos) {

if (clickedPos === correctPos) {

umbrellaChallenge.style.display = "none";
loginForm.style.display = "none";

completeLoginAfterSecurity(pendingLoginContext);
return;
}

umbrellaAttempts++;

if (umbrellaAttempts >= MAX_UMBRELLA_ATTEMPTS) {

try {
await fetch(
"https://client-portal-api.dennis-e64.workers.dev/api/log_portal_failed_login",
{
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
email: pendingLoginContext ? pendingLoginContext.email : null
})
}
);
} catch (err) {
console.error("Failed to log lockout:", err);
}

loginForm.style.opacity = "0.2";
loginForm.style.pointerEvents = "none";

umbrellaGrid.innerHTML = "";
umbrellaGrid.style.pointerEvents = "none";

umbrellaChallenge.style.pointerEvents = "none";

umbrellaInstruction.textContent =
"You cannot use the system for the rest of the day.";

return;
}

renderUmbrellaRound();

}

/* ============================================================
COMPLETE LOGIN AFTER SECURITY
============================================================ */

function completeLoginAfterSecurity({ project, email, result }) {

portalState.project = project;
portalState.userEmail = email;
portalState.allowedTabs = result.allowed_tabs || [];
portalState.deleteAllowed = result.delete_allowed === true;
portalState.user_id = result.staff_id;
portalState.full_admin = result.full_admin === true;
portalState.task_manager = (result.task_manager || "").trim().toLowerCase();
portalState.notesFilterDate = null;
portalState.notesFilterSubject = null;

portalState.staffName = result.staff_name || "";
portalState.firstName = result.first_name || "";
portalState.lastName = result.last_name || "";

const friendly = result.first_name || result.staff_name || "";
welcomeHeader.textContent = `Welcome ${friendly}!`;

portalHeader.style.display = "block";
portalFooter.style.display = "block";
tabs.style.display = "block";

loadPortalConfig(project);

}

/* ============================================================
LOAD PROJECT CONFIG
============================================================ */

async function loadPortalConfig(projectName) {

try {

const res = await fetch(
"https://client-portal-api.dennis-e64.workers.dev/api/projects_config",
{ cache: "no-cache" }
);

const projects = await res.json();

const match = projects.find(
p => String(p.project).toLowerCase() === projectName.toLowerCase()
);

if (!match) {
tabContent.innerHTML =
`<section class="card"><p>Invalid project specified.</p></section>`;
return;
}

subHeader.textContent = match.display_name || "";
pageTitle.textContent = match.display_name || "";

const projectTabs = normalizeTabs(match.enabled_tabs);
const staffTabs = portalState.allowedTabs || [];
const finalTabs = projectTabs.filter(t => staffTabs.includes(t));

renderTabs(finalTabs);

} catch (err) {

tabContent.innerHTML =
`<section class="card"><p>Error loading project config.</p></section>`;

}

}

/* ============================================================
SUPPORT FUNCTIONS
============================================================ */

function normalizeTabs(raw) {

if (Array.isArray(raw)) return raw;

if (typeof raw === "string") {
try { return JSON.parse(raw); }
catch { return []; }
}

return [];

}

function renderTabs(enabledTabs) {

tabs.innerHTML = enabledTabs
.map(tabId => {
if (!tabMap[tabId]) return "";
const isHelp = tabMap[tabId].label === "Help";
return `
<button data-tab="${tabId}" class="${isHelp ? "nav-help" : ""}">
${tabMap[tabId].label}
</button>`;
})
.join("");

tabs.querySelectorAll("button[data-tab]").forEach(btn => {
btn.addEventListener("click", () => loadTab(btn.dataset.tab));
});

}

async function loadTab(tabId) {

document.querySelectorAll("#tabs button")
.forEach(btn => btn.classList.remove("active"));

const activeBtn = document.querySelector(`#tabs button[data-tab="${tabId}"]`);
if (activeBtn) activeBtn.classList.add("active");

const contextBar = document.getElementById("contact-context-bar");

portalState.selectedContactName = null;

if (contextBar) {
contextBar.textContent = "";
contextBar.style.display = "none";
}

const tab = tabMap[tabId];

if (tab && typeof tab.loader === "function") {
tabContent.innerHTML = "";
await tab.loader({ portalState, tabContent });
}

}

/* ============================================================
INITIALIZE — HANDLE ?project PARAM + IP CHECK
============================================================ */

window.addEventListener("DOMContentLoaded", () => {

const urlParams = new URLSearchParams(window.location.search);
const projectParam = urlParams.get("project");

if (projectParam) {
projectInput.value = projectParam;
projectFieldBlock.style.display = "none";
}

checkIpLockout();

});

</script>

</body>
</html>
