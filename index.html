TAB MODULE LOADING

Menu descriptors come from the authenticated backend response.
No top-level tab modules are imported until an allowed tab opens.

  userEmail: "",
  staffName: "",
  allowedTabs: [],
  deleteAllowed: false,

};

window.portalState = portalState;

const loginForm = document.getElementById("loginForm");

const errorBox = document.getElementById("errorBox");

const portalHeader = document.getElementById("portalHeader");
const portalFooter = document.getElementById("portalFooter");
const welcomeHeader = document.getElementById("welcomeHeader");
const subHeader = document.getElementById("subHeader");
const pageTitle = document.getElementById("page-title");

/* ============================================================
SECURITY STATE
============================================================ */

const MAX_UMBRELLA_ATTEMPTS = 3;
let umbrellaAttempts = 0;
let pendingLoginContext = null;

/* ============================================================
PORTAL ENTRY AUTHENTICATION

All projects require the backend's verified-session gate.
No contact, lead, or other data-request code is changed here.
============================================================ */

const PORTAL_AUTH_API =
  "https://client-portal-api.dennis-e64.workers.dev/api/portal_auth";

const PORTAL_AUTH_STORAGE_KEY = "redumbrella.portal.auth.v1";

let portalAuthMemory = {};
let portalAuthBusy = false;

function readPortalAuthSessions() {

  try {
    const raw = localStorage.getItem(PORTAL_AUTH_STORAGE_KEY);
    const sessions = raw ? JSON.parse(raw) : portalAuthMemory;

    if (
      !sessions ||
      typeof sessions !== "object" ||
      Array.isArray(sessions)
    ) {
      return {};
    }

    return sessions;

  } catch (err) {
    return portalAuthMemory;
  }

}

function portalAuthSessionKey(project, email) {

  return (
    String(project).trim().toLowerCase() +
    "|" +
    String(email).trim().toLowerCase()
  );

}

function savePortalAuthSession(session) {

  const sessions = readPortalAuthSessions();
  const now = Date.now();

  // Remove locally stored sessions past their absolute maximum.
  for (const key of Object.keys(sessions)) {
    const expiry = Date.parse(sessions[key]?.absolute_expires_at || "");

    if (!Number.isFinite(expiry) || expiry <= now) {
      delete sessions[key];
    }
  }

  const key = portalAuthSessionKey(session.project, session.email);

  sessions[key] = {
    project: session.project,
    email: session.email,
    token: session.token,
    absolute_expires_at: session.absolute_expires_at
  };

  portalAuthMemory = sessions;

  try {
    localStorage.setItem(
      PORTAL_AUTH_STORAGE_KEY,
      JSON.stringify(sessions)
    );
  } catch (err) {
    // Verification still works for this page if storage is unavailable.
    console.warn("Portal session could not be remembered in this browser.");
  }

}

function removePortalAuthSession(project, email) {

  const sessions = readPortalAuthSessions();
  delete sessions[portalAuthSessionKey(project, email)];
  portalAuthMemory = sessions;

  try {
    localStorage.setItem(
      PORTAL_AUTH_STORAGE_KEY,
      JSON.stringify(sessions)
    );
  } catch (err) {
    // Retain the in-memory result when browser storage is unavailable.
  }

}

async function portalAuthRequest(action, body, token = "") {

  const headers = {
    "Content-Type": "application/json"
  };

  if (token) {
    headers.Authorization = `Bearer ${token}`;
  }

  const response = await fetch(`${PORTAL_AUTH_API}/${action}`, {
    method: "POST",
    cache: "no-store",
    headers,
    body: JSON.stringify(body)
  });

  let result;

  try {
    result = await response.json();
  } catch (err) {
    throw new Error("The sign-in service returned an invalid response.");
  }

  if (!response.ok || result.success === false) {
    const error = new Error(
      result.error || "Unable to complete sign-in. Please try again."
    );
    error.status = response.status;
    throw error;
  }

  return result;

}

function showPortalAuthNotice(message) {

  let notice = document.getElementById("portalAuthNotice");

  if (!notice) {
    notice = document.createElement("div");
    notice.id = "portalAuthNotice";
    notice.style.maxWidth = "420px";
    notice.style.margin = "30px auto";
    notice.style.padding = "20px";
    notice.style.textAlign = "center";
    notice.style.border = "1px solid #ddd";
    notice.style.borderRadius = "8px";
    notice.setAttribute("role", "status");
    loginForm.after(notice);
  }

  notice.replaceChildren();

  const heading = document.createElement("h3");
  heading.textContent = "Check your email";
  notice.appendChild(heading);

  const description = document.createElement("p");
  description.textContent = message;
  notice.appendChild(description);

  const instruction = document.createElement("p");
  instruction.textContent =
    "Open the sign-in link on the device where you want to use the portal. " +
    "Each link works only once. Opening it on another device will sign " +
    "you in there instead.";
  notice.appendChild(instruction);

  const backButton = document.createElement("button");
  backButton.type = "button";
  backButton.textContent = "Back to login";

  backButton.addEventListener("click", () => {
    notice.remove();
    loginForm.style.display = "block";
    emailInput.disabled = false;
    loginBtn.disabled = false;
    projectInput.disabled = false;
    errorBox.textContent = "";
    pendingLoginContext = null;
  });

  notice.appendChild(backButton);

}

async function ensurePortalEntrySession(project, email) {

  const authProject = String(project).trim().toLowerCase();
  const authEmail = String(email).trim().toLowerCase();

  const sessions = readPortalAuthSessions();
  const session = sessions[portalAuthSessionKey(authProject, authEmail)];

  const status = await portalAuthRequest("status", {
    project: authProject,
    email: authEmail
  }, session?.token || "");

  if (status.required === true && status.valid === true) {
    return true;
  }

  if (status.required !== true || status.valid !== false) {
    throw new Error("Unexpected sign-in response. Please try again.");
  }

  removePortalAuthSession(authProject, authEmail);

  const emailResult = await portalAuthRequest("request", {
    project: authProject,
    email: authEmail
  });

  if (emailResult.required !== true || emailResult.sent !== true) {
    throw new Error("Unable to send your sign-in link. Please try again.");
  }

  showPortalAuthNotice(
    emailResult.message ||
    "Check your email for your sign-in link. It expires in 15 minutes."
  );

  return false;

}

async function verifyPortalEmailReturn() {

  const fragment = new URLSearchParams(window.location.hash.slice(1));
  const token = fragment.get("portal_auth");

  if (!token) {
    return null;
  }

  // Remove the email credential from the address bar before verification.
  history.replaceState(
    null,
    "",
    window.location.pathname + window.location.search
  );

  const verified = await portalAuthRequest("verify", { token });

  if (
    verified.verified !== true ||
    !verified.token ||
    !verified.project ||
    !verified.email
  ) {
    throw new Error("Unable to verify this sign-in link.");
  }

  savePortalAuthSession(verified);
  return verified;

}

/* ============================================================
BACKEND MENU STATE

This map contains only descriptors returned for the current user.
It does not contain the full portal menu catalog.
============================================================ */

let tabMap = Object.create(null);
const tabModuleCache = new Map();
let tabLoadSequence = 0;

/* ============================================================
IP LOCKOUT CHECK
============================================================ */

async function checkIpLockout() {

try {

const res = await fetch(
"https://client-portal-api.dennis-e64.workers.dev/api/check_portal_failed_login",
{ method: "POST", headers: { "Content-Type": "application/json" } }
);

const result = await res.json();

if (result.blocked) {

loginForm.style.display = "none";
umbrellaChallenge.style.display = "none";

const lockoutMsg = document.createElement("div");
lockoutMsg.style.textAlign = "center";
lockoutMsg.style.marginTop = "40px";
lockoutMsg.style.fontSize = "20px";
lockoutMsg.style.fontWeight = "600";
lockoutMsg.style.color = "red";
lockoutMsg.textContent = result.message ||
"You cannot use the system for the rest of the day.";

document.body.appendChild(lockoutMsg);
return;
}

loginForm.style.display = "block";

} catch (err) {

loginForm.style.display = "block";

}

}

/* ============================================================
LOGIN HANDLER (MODIFIED)
============================================================ */

async function attemptLogin() {

errorBox.textContent = "";

const project = projectInput.value.trim();
const email = emailInput.value.trim();

if (!project) {
errorBox.textContent = "Please enter a project.";
return;
}

if (!email) {
errorBox.textContent = "Please enter an email.";
return;
}

try {

const res = await fetch(
"https://client-portal-api.dennis-e64.workers.dev/api/check_staff",
{
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ project, email })
}
);

const result = await res.json();

await fetch(
"https://client-portal-api.dennis-e64.workers.dev/api/log_portal_login",
{
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
project,
email,
status: result.valid ? "success" : "invalid",
reason: result.valid ? null : "Email not found for project",
userAgent: navigator.userAgent
})
}
);

if (!result.valid) {
errorBox.textContent = "Invalid email for this project.";
return;
}

pendingLoginContext = { project, email, result };

emailInput.disabled = true;
loginBtn.disabled = true;
projectInput.disabled = true;

startUmbrellaChallenge();

} catch (err) {

errorBox.textContent = "Server error. Try again.";

}

}

loginBtn.addEventListener("click", attemptLogin);

loginForm.addEventListener("keydown", (e) => {
if (e.key === "Enter") {
e.preventDefault();
loginBtn.click();
}
});

/* ============================================================
UMBRELLA CHALLENGE LOGIC (NEW)
============================================================ */

function startUmbrellaChallenge() {
umbrellaAttempts = 0;
umbrellaChallenge.style.display = "block";
renderUmbrellaRound();
}

function renderUmbrellaRound() {

umbrellaTarget.src = "./images/image1.png";
umbrellaTarget.alt = "Target umbrella";

umbrellaGrid.innerHTML = "";

const umbrellaMap = {
target: "image1.png",
correct: "image4.png",
wrong: ["image2.png", "image3.png"]
};

const options = [
umbrellaMap.correct,
...umbrellaMap.wrong
];

for (let i = options.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[options[i], options[j]] = [options[j], options[i]];
}

let correctIndex = null;

options.forEach((file, index) => {

const img = document.createElement("img");
img.src = "./images/" + file;
img.alt = "Umbrella option";

const position = index + 1;

if (file === umbrellaMap.correct) {
correctIndex = position;
}

img.addEventListener("click", () => {
handleUmbrellaClick(position, correctIndex);
});

umbrellaGrid.appendChild(img);

});

const remaining = MAX_UMBRELLA_ATTEMPTS - umbrellaAttempts;

if (umbrellaAttempts === 0) {
umbrellaInstruction.textContent = "Click the image that matches the one above.";
} else if (remaining === 2) {
umbrellaInstruction.textContent = "Incorrect. Try again. You have 2 more attempts.";
} else if (remaining === 1) {
umbrellaInstruction.textContent = "Incorrect. You have one final attempt. If you do not get this correct, you will not be allowed in for rest of day";
}

}

async function handleUmbrellaClick(clickedPos, correctPos) {

if (clickedPos === correctPos) {

  if (!pendingLoginContext || portalAuthBusy) {
    return;
  }

  portalAuthBusy = true;
  umbrellaGrid.style.pointerEvents = "none";
  umbrellaInstruction.textContent = "Checking your sign-in…";

  try {

    const { project, email } = pendingLoginContext;
    const canContinue = await ensurePortalEntrySession(project, email);

    if (!canContinue) {
      umbrellaChallenge.style.display = "none";
      loginForm.style.display = "none";
      return;
    }

    umbrellaChallenge.style.display = "none";
    loginForm.style.display = "none";

    await completeLoginAfterSecurity(pendingLoginContext);

  } catch (err) {

    console.error("[Portal entry auth]", err);

    // Do not open the portal if authentication or menu loading fails.
    portalHeader.style.display = "none";
    portalFooter.style.display = "none";
    tabs.style.display = "none";
    umbrellaChallenge.style.display = "none";
    loginForm.style.display = "block";

    emailInput.disabled = false;
    loginBtn.disabled = false;
    projectInput.disabled = false;

    errorBox.textContent =
      err.message || "Unable to verify your sign-in. Please try again.";

  } finally {

    portalAuthBusy = false;
    umbrellaGrid.style.pointerEvents = "";

  }

  return;
}

umbrellaAttempts++;

if (umbrellaAttempts >= MAX_UMBRELLA_ATTEMPTS) {

try {
await fetch(
"https://client-portal-api.dennis-e64.workers.dev/api/log_portal_failed_login",
{
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
email: pendingLoginContext ? pendingLoginContext.email : null
})
}
);
} catch (err) {
console.error("Failed to log lockout:", err);
}

loginForm.style.opacity = "0.2";
loginForm.style.pointerEvents = "none";

umbrellaGrid.innerHTML = "";
umbrellaGrid.style.pointerEvents = "none";

umbrellaChallenge.style.pointerEvents = "none";

umbrellaInstruction.textContent =
"You cannot use the system for the rest of the day.";

return;
}

renderUmbrellaRound();

}

/* ============================================================
COMPLETE LOGIN AFTER SECURITY
============================================================ */

async function completeLoginAfterSecurity({ project, email }) {

  // Get current identity, permissions, project configuration, and menu
  // from the authenticated backend. Do not trust the pre-login lookup
  // as the authority for opening the portal.
  const menu = await loadPortalConfig(project, email);
  const result = menu.staff;
  const match = menu.project_config;

  const nextTabMap = Object.create(null);

  for (const descriptor of menu.tabs) {
    nextTabMap[String(descriptor.id)] = {
      id: String(descriptor.id),
      label: descriptor.label,
      module: descriptor.module,
      exportName: descriptor.exportName,
      isHelp: descriptor.isHelp === true
    };
  }

  tabMap = nextTabMap;
  tabLoadSequence++;

  portalState.project = menu.project;
  portalState.userEmail = menu.email;
  portalState.allowedTabs = menu.tabs.map(tab => String(tab.id));
  portalState.enabled_tabs = [...portalState.allowedTabs];
  portalState.deleteAllowed = result.delete_allowed === true;
  portalState.canEdit = result.can_edit === true;
  portalState.isDemoAccount = result.is_demo_account === true;
  portalState.canSeeFinancials = result.can_see_financials === true;
  portalState.user_id = result.staff_id;
  portalState.full_admin = result.full_admin === true;
  portalState.task_manager = (result.task_manager || "").trim().toLowerCase();
  portalState.notesFilterDate = null;
  portalState.notesFilterSubject = null;

  portalState.can_view_notes_summary =
    result.can_view_notes_summary === true;

  portalState.can_generate_notes_summary =
    result.can_generate_notes_summary === true;

  portalState.staffName = result.staff_name || "";
  portalState.firstName = result.first_name || "";
  portalState.lastName = result.last_name || "";
  portalState.display_name = match.display_name || "";

  portalState.notes_summary_enabled =
    match.notes_summary_enabled === true;

  const friendly = result.first_name || result.staff_name || "";
  welcomeHeader.textContent = `Welcome ${friendly}!`;

  if (portalState.isDemoAccount) {
    subHeader.innerHTML =
      `FREE DEMO Account &middot; Read Privileges Only &middot; ` +
      `To schedule a call for next steps, ` +
      `<a href="https://goalstoresults.com/demo-portal-next-steps" target="_blank" rel="noopener">Click Here</a>`;
  } else {
    subHeader.textContent = match.display_name || "";
  }

  pageTitle.textContent = match.display_name || "";

  renderTabs(menu.tabs);

  const notice = document.getElementById("portalAuthNotice");
  if (notice) {
    notice.remove();
  }

  tabContent.replaceChildren();

  if (menu.tabs.length === 0) {
    showTabMessage("No portal tabs are currently enabled for your account.");
  }

  portalHeader.style.display = "block";
  portalFooter.style.display = "block";
  tabs.style.display = "block";
  loginForm.style.display = "none";
  umbrellaChallenge.style.display = "none";

}

/* ============================================================
LOAD PROJECT CONFIG AND MENU FROM THE AUTHENTICATED BACKEND
============================================================ */

async function loadPortalConfig(projectName, email) {

  const sessions = readPortalAuthSessions();
  const session = sessions[portalAuthSessionKey(projectName, email)];

  if (!session || !session.token) {
    throw new Error("Please verify your email before opening the portal.");
  }

  let menu;

  try {
    menu = await portalAuthRequest("menu", {
      project: String(projectName).trim().toLowerCase(),
      email: String(email).trim().toLowerCase()
    }, session.token);
  } catch (err) {
    if (err.status === 401 || err.status === 403) {
      removePortalAuthSession(projectName, email);
    }
    throw err;
  }

  if (
    menu.success !== true ||
    !Array.isArray(menu.tabs) ||
    !menu.staff ||
    menu.staff.valid !== true ||
    !menu.project_config ||
    typeof menu.project !== "string" ||
    typeof menu.email !== "string"
  ) {
    throw new Error("The portal menu service returned an invalid response.");
  }

  if (
    menu.project.trim().toLowerCase() !== String(projectName).trim().toLowerCase() ||
    menu.email.trim().toLowerCase() !== String(email).trim().toLowerCase()
  ) {
    throw new Error("The returned menu does not match your sign-in session.");
  }

  const seenIds = new Set();

  for (const descriptor of menu.tabs) {
    if (
      !descriptor ||
      !/^\d+$/.test(String(descriptor.id)) ||
      typeof descriptor.label !== "string" ||
      typeof descriptor.module !== "string" ||
      !/^\.\/js\/[a-zA-Z0-9_-]+\.js$/.test(descriptor.module) ||
      typeof descriptor.exportName !== "string" ||
      !/^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(descriptor.exportName) ||
      seenIds.has(String(descriptor.id))
    ) {
      throw new Error("The portal menu contains an invalid tab descriptor.");
    }

    seenIds.add(String(descriptor.id));
  }

  return menu;

}

/* ============================================================
SUPPORT FUNCTIONS
============================================================ */

function normalizeTabs(raw) {

if (Array.isArray(raw)) return raw;

if (typeof raw === "string") {
try { return JSON.parse(raw); }
catch { return []; }
}

return [];

}

function renderTabs(menuTabs) {

  tabs.replaceChildren();

  for (const descriptor of menuTabs) {
    const tabId = String(descriptor.id);

    if (!Object.prototype.hasOwnProperty.call(tabMap, tabId)) {
      continue;
    }

    const button = document.createElement("button");
    button.type = "button";
    button.dataset.tab = tabId;
    button.textContent = descriptor.label;

    if (descriptor.isHelp === true) {
      button.classList.add("nav-help");
    }

    button.addEventListener("click", () => {
      loadTab(tabId);
    });

    tabs.appendChild(button);
    tabs.appendChild(document.createTextNode(" "));   
  }

}

function showTabMessage(message) {

  const section = document.createElement("section");
  section.className = "card";

  const paragraph = document.createElement("p");
  paragraph.textContent = message;
  section.appendChild(paragraph);

  tabContent.replaceChildren(section);

}

async function loadTab(tabId) {

  tabId = String(tabId);

  // Only IDs present in the backend-provided menu can be opened here.
  if (!Object.prototype.hasOwnProperty.call(tabMap, tabId)) {
    return;
  }

  const tab = tabMap[tabId];
  const loadSequence = ++tabLoadSequence;

  document.querySelectorAll("#tabs button")
    .forEach(btn => btn.classList.remove("active"));

  const activeBtn = document.querySelector(`#tabs button[data-tab="${tabId}"]`);
  if (activeBtn) activeBtn.classList.add("active");

  const contextBar = document.getElementById("contact-context-bar");

  portalState.selectedContactName = null;

  if (contextBar) {
    contextBar.textContent = "";
    contextBar.style.display = "none";
  }

  showTabMessage("Loading…");

  try {

    // Resolve only the module descriptor supplied by the backend.
    const moduleUrl = new URL(tab.module, window.location.href);

    if (moduleUrl.origin !== window.location.origin) {
      throw new Error("The tab module must be served from this portal.");
    }

    let modulePromise = tabModuleCache.get(moduleUrl.href);

    if (!modulePromise) {
      modulePromise = import(moduleUrl.href);
      tabModuleCache.set(moduleUrl.href, modulePromise);
    }

    let tabModule;

    try {
      tabModule = await modulePromise;
    } catch (err) {
      tabModuleCache.delete(moduleUrl.href);
      throw err;
    }

    // Do not render a delayed import if the user selected another tab.
    if (loadSequence !== tabLoadSequence) {
      return;
    }

    const loader = tabModule[tab.exportName];

    if (typeof loader !== "function") {
      throw new Error("The selected tab could not be initialized.");
    }

    tabContent.innerHTML = "";
    await loader({ portalState, tabContent });

  } catch (err) {

    console.error("[Portal tab]", err);

    if (loadSequence === tabLoadSequence) {
      showTabMessage(
        "Unable to load this tab. Please try again or contact support."
      );
    }

  }

}

window.loadTab = loadTab;   // Existing modules can still trigger tab switches.

/* ============================================================
INITIALIZE — HANDLE ?project PARAM + IP CHECK
============================================================ */

window.addEventListener("DOMContentLoaded", async () => {

  const urlParams = new URLSearchParams(window.location.search);
  const projectParam = urlParams.get("project");

  if (!projectParam) {
    // Keep the existing rule: a project is required in the portal URL.
    noProjectError.style.display = "block";
    return;
  }

  if (projectParam.toLowerCase() === "gtr") {
    // Keep your editable project field for GTR testing.
    projectInput.value = projectParam;
  } else {
    // Keep the project field hidden for other projects.
    projectInput.value = projectParam;
    projectFieldBlock.style.display = "none";
  }

  const fragment = new URLSearchParams(window.location.hash.slice(1));
  const hasEmailLink = fragment.has("portal_auth");

  if (hasEmailLink) {
    emailInput.disabled = true;
    loginBtn.disabled = true;
    projectInput.disabled = true;
  }

  await checkIpLockout();

  // Existing lockout logic leaves the login form hidden when blocked.
  if (loginForm.style.display !== "block") {
    return;
  }

  if (!hasEmailLink) {
    return;
  }

  errorBox.textContent = "Verifying your sign-in link…";

  try {

    const verified = await verifyPortalEmailReturn();

    if (!verified) {
      throw new Error("No sign-in token was found. Request a new link.");
    }

    // Trust the verified link's database identity, not URL parameters.
    const verifiedProject = String(verified.project);
    const verifiedEmail = String(verified.email);

    const cleanUrl = new URL(window.location.href);
    cleanUrl.searchParams.set("project", verifiedProject);
    cleanUrl.hash = "";

    history.replaceState(null, "", cleanUrl);

    projectInput.value = verifiedProject;
    emailInput.value = verifiedEmail;

    projectFieldBlock.style.display =
      verifiedProject.toLowerCase() === "gtr" ? "" : "none";

    // The authenticated menu endpoint now provides current permissions.
    pendingLoginContext = {
      project: verifiedProject,
      email: verifiedEmail
    };

    await completeLoginAfterSecurity(pendingLoginContext);
    errorBox.textContent = "";

    // Logging failure must not block an otherwise valid email sign-in.
    try {
      await fetch(
        "https://client-portal-api.dennis-e64.workers.dev/api/log_portal_login",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            project: verifiedProject,
            email: verifiedEmail,
            status: "success",
            reason: "Email link verified",
            userAgent: navigator.userAgent
          })
        }
      );
    } catch (logError) {
      console.error("Unable to log verified sign-in:", logError);
    }

  } catch (err) {

    console.error("[Portal email return]", err);

    portalHeader.style.display = "none";
    portalFooter.style.display = "none";
    tabs.style.display = "none";
    loginForm.style.display = "block";
    errorBox.textContent =
      err.message || "Sign-in failed. Please request a new email link.";

  } finally {

    emailInput.disabled = false;
    loginBtn.disabled = false;
    projectInput.disabled = false;

  }

});
