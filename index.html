<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title id="page-title"></title>
  <link rel="stylesheet" href="style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <header>
    <h1 id="portal-title"></h1>
    <div id="project-selector-row" style="display:none;">
      <label for="project-selector">Project:</label>
      <select id="project-selector"></select>
    </div>
  </header>

  <!-- Top-level tabs -->
  <nav id="tabs" style="display:none;"></nav>

  <div id="tab-content"></div>

  <footer style="margin-top:20px; text-align:center; color:#666;">
    <small>Portal Version: 1.3.0</small>
  </footer>

  <script type="module">
    import { loadContactsTab } from "./js/contacts.js";
    import { loadFinancialsTab } from "./js/financials.js";
    import { loadNotesTab } from "./js/notes.js";
    import { loadTasksTab } from "./js/tasks.js";
    import { loadLookupsTab } from "./js/lookups.js";
    import { loadDashboardTab } from "./js/dashboard.js";
    // 👇 NEW import
    import { loadGroupsTab } from "./js/groups.js";

    const portalState = { project: "", contactId: "" };
    const portalTitle = document.getElementById("portal-title");
    const pageTitle = document.getElementById("page-title");
    const projectSelector = document.getElementById("project-selector");
    const selectorRow = document.getElementById("project-selector-row");
    const tabs = document.getElementById("tabs");
    const tabContent = document.getElementById("tab-content");

    const tabMap = {
      "1": { label: "Contacts", loader: loadContactsTab },
      "2": { label: "Financials", loader: loadFinancialsTab },
      "3": { label: "Notes", loader: loadNotesTab },
      "4": { label: "Tasks", loader: loadTasksTab },
      "5": { label: "Lookups", loader: loadLookupsTab },
      "6": { label: "Dashboard", loader: loadDashboardTab },
      // 👇 NEW entry
      "7": { label: "Groups", loader: loadGroupsTab }
    };

    async function loadProjects() {
      try {
        const res = await fetch("https://client-portal-api.dennis-e64.workers.dev/api/projects_config", { cache: "no-cache" });
        const projects = await res.json();
        if (!Array.isArray(projects) || projects.length === 0) throw new Error("No projects returned");

        const urlParams = new URLSearchParams(window.location.search);
        const projectParamRaw = urlParams.get("project");
        let projectParam = projectParamRaw ? projectParamRaw.trim() : "";

        if (!projectParam) {
          // No project param → show blank title and selector
          selectorRow.style.display = "block";
          projectSelector.innerHTML = projects
            .map(p => `<option value="${p.project}">${p.display_name}</option>`)
            .join("");

          portalState.project = ""; // nothing selected yet
          portalTitle.textContent = "";
          pageTitle.textContent = "";
          tabs.style.display = "none";

          projectSelector.addEventListener("change", () => {
            const selected = projectSelector.options[projectSelector.selectedIndex];
            portalState.project = selected.value;
            portalTitle.textContent = selected.text;
            pageTitle.textContent = selected.text;

            const enabledTabs = normalizeTabs(
              projects.find(p => p.project === selected.value)?.enabled_tabs
            );
            renderTabs(enabledTabs);
            tabs.style.display = "block";
            tabContent.innerHTML = "";
          });

        } else {
          // Project param provided → load that project immediately
          const match = projects.find(p => String(p.project).toLowerCase() === projectParam.toLowerCase());
          if (!match) {
            tabs.style.display = "none";
            tabContent.innerHTML =
              `<section class="card"><p>Invalid project specified. No UI available.</p></section>`;
            return;
          }

          portalState.project = match.project;
          portalTitle.textContent = match.display_name || "";
          pageTitle.textContent = match.display_name || "";

          const enabledTabs = normalizeTabs(match.enabled_tabs);
          renderTabs(enabledTabs);
          tabs.style.display = "block";
        }

      } catch (err) {
        console.error("Failed to load projects:", err);
        selectorRow.style.display = "none";
        tabs.style.display = "none";
        tabContent.innerHTML =
          `<section class="card"><p>Unable to load projects. Please try again later.</p></section>`;
      }
    }

    function normalizeTabs(raw) {
      if (Array.isArray(raw)) return raw;
      if (typeof raw === "string") {
        try { return JSON.parse(raw); } catch { return []; }
      }
      return [];
    }

    function renderTabs(enabledTabs) {
      tabs.innerHTML = enabledTabs
        .map(tabId => tabMap[tabId] ? `<button data-tab="${tabId}">${tabMap[tabId].label}</button>` : "")
        .join("");

      tabs.querySelectorAll("button[data-tab]").forEach(btn => {
        btn.addEventListener("click", () => loadTab(btn.dataset.tab));
      });
    }

    async function loadTab(tabId) {
      document.querySelectorAll("#tabs button").forEach(btn =>
        btn.classList.remove("active")
      );
      document.querySelector(`#tabs button[data-tab="${tabId}"]`)?.classList.add("active");

      const tab = tabMap[tabId];
      if (tab && typeof tab.loader === "function") {
        tabContent.innerHTML = "";
        await tab.loader({ portalState, tabContent });
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      await loadProjects();
    });
  </script>
</body>
</html>
